<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <linearGradient id="scBg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#0c0314" /><stop offset="50%" stop-color="#1e0830" /><stop offset="100%" stop-color="#08020e" /></linearGradient>
    <linearGradient id="scNeon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"><animate attributeName="stop-color" values="#ef4444;#ec4899;#8b5cf6;#ef4444" dur="7s" repeatCount="indefinite" /></stop>
      <stop offset="50%" stop-color="#ec4899"><animate attributeName="stop-color" values="#ec4899;#8b5cf6;#ef4444;#ec4899" dur="7s" repeatCount="indefinite" /></stop>
      <stop offset="100%" stop-color="#8b5cf6"><animate attributeName="stop-color" values="#8b5cf6;#ef4444;#ec4899;#8b5cf6" dur="7s" repeatCount="indefinite" /></stop>
    </linearGradient>
    <linearGradient id="scGrid" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#ef4444" stop-opacity="0" /><stop offset="100%" stop-color="#ec4899" stop-opacity="0.35" /></linearGradient>
    <filter id="scGlow"><feGaussianBlur stdDeviation="5" result="b" /><feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge></filter>
  </defs>

  <style>
    @keyframes scFloat { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-10px); } }
    .floating-sonic { animation: scFloat 5.5s ease-in-out infinite; }
  </style>

  <rect width="1200" height="360" fill="url(#scBg)" />

  <g opacity="0.65">
    <line x1="0" y1="260" x2="1200" y2="260" stroke="#ef4444" stroke-opacity="0.25" stroke-width="1" />
    <line x1="600" y1="260" x2="0" y2="360" stroke="url(#scGrid)" stroke-width="1.5" />
    <line x1="600" y1="260" x2="250" y2="360" stroke="url(#scGrid)" stroke-width="1.5" />
    <line x1="600" y1="260" x2="500" y2="360" stroke="url(#scGrid)" stroke-width="1.5" />
    <line x1="600" y1="260" x2="700" y2="360" stroke="url(#scGrid)" stroke-width="1.5" />
    <line x1="600" y1="260" x2="950" y2="360" stroke="url(#scGrid)" stroke-width="1.5" />
    <line x1="600" y1="260" x2="1200" y2="360" stroke="url(#scGrid)" stroke-width="1.5" />
    <line x1="0" y1="300" x2="1200" y2="300" stroke="#ef4444" stroke-opacity="0.2" stroke-width="1" />
    <line x1="0" y1="340" x2="1200" y2="340" stroke="#ec4899" stroke-opacity="0.3" stroke-width="1.5" />
  </g>

  <circle cx="200" cy="110" r="140" fill="#ef4444" opacity="0.08" filter="url(#scGlow)" />
  <circle cx="960" cy="170" r="160" fill="#ec4899" opacity="0.12" filter="url(#scGlow)" />

  <!-- 3D Equalizer & Audio Spectrum Rings -->
  <g transform="translate(940, 180)" class="floating-sonic">
    <circle cx="0" cy="0" r="110" fill="none" stroke="url(#scNeon)" stroke-width="2" stroke-dasharray="8 6" opacity="0.75">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="20s" repeatCount="indefinite" />
    </circle>
    <!-- Audio Waveform Bars -->
    <rect x="-45" y="-15" width="8" height="30" rx="4" fill="#ef4444" />
    <rect x="-30" y="-30" width="8" height="60" rx="4" fill="#ec4899" />
    <rect x="-15" y="-45" width="8" height="90" rx="4" fill="#8b5cf6" filter="url(#scGlow)" />
    <rect x="0" y="-60" width="8" height="120" rx="4" fill="#ef4444" filter="url(#scGlow)" />
    <rect x="15" y="-40" width="8" height="80" rx="4" fill="#ec4899" />
    <rect x="30" y="-25" width="8" height="50" rx="4" fill="#8b5cf6" />
    <rect x="45" y="-10" width="8" height="20" rx="4" fill="#ef4444" />

    <!-- Inactive Badge -->
    <g transform="translate(-60, 48)">
      <rect x="0" y="0" width="120" height="24" rx="6" fill="#450a0a" stroke="#ef4444" stroke-width="1" />
      <text x="60" y="16" font-family="'Fira Code', monospace" font-size="10" font-weight="bold" fill="#fca5a5" text-anchor="middle">🛑 ARCHIVED BOT</text>
    </g>
  </g>

  <!-- Left Typography -->
  <g transform="translate(80, 140)">
    <g transform="translate(0, -35)">
      <rect x="0" y="-14" width="280" height="24" rx="12" fill="#ef4444" fill-opacity="0.15" stroke="#ef4444" stroke-width="1" />
      <circle cx="12" cy="-2" r="4" fill="#ef4444" />
      <text x="26" y="2" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="800" fill="#fca5a5" letter-spacing="2">ARCHIVED // AUDIO STREAM ENGINE</text>
    </g>

    <text x="0" y="32" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Montserrat', sans-serif" font-size="52" font-weight="900" fill="url(#scNeon)" filter="url(#scGlow)" letter-spacing="3">
      PIMX_SONIC_BOT
    </text>

    <text x="0" y="68" font-family="'Fira Code', monospace" font-size="16" font-weight="600" fill="#e2e8f0" letter-spacing="1">
      ⚡ High-Speed Multi-Source Audio Downloader, FFmpeg Transcoder &amp; Auto Cleanup
    </text>

    <g transform="translate(0, 92)">
      <rect x="0" y="0" width="165" height="26" rx="6" fill="#1c0a24" stroke="#ef4444" stroke-width="1" />
      <text x="82" y="17" font-family="'Fira Code', monospace" font-size="11" font-weight="bold" fill="#fca5a5" text-anchor="middle">🛑 Inactive Reference</text>

      <rect x="175" y="0" width="160" height="26" rx="6" fill="#1c0a24" stroke="#ec4899" stroke-width="1" />
      <text x="255" y="17" font-family="'Fira Code', monospace" font-size="11" font-weight="bold" fill="#f472b6" text-anchor="middle">🎵 320kbps MP3</text>

      <rect x="345" y="0" width="150" height="26" rx="6" fill="#1c0a24" stroke="#8b5cf6" stroke-width="1" />
      <text x="420" y="17" font-family="'Fira Code', monospace" font-size="11" font-weight="bold" fill="#c084fc" text-anchor="middle">⚡ yt-dlp Core</text>

      <rect x="505" y="0" width="150" height="26" rx="6" fill="#1c0a24" stroke="#34d399" stroke-width="1" />
      <text x="580" y="17" font-family="'Fira Code', monospace" font-size="11" font-weight="bold" fill="#34d399" text-anchor="middle">🧹 Auto Purge</text>
    </g>
  </g>

  <line x1="0" y1="358" x2="1200" y2="358" stroke="url(#scNeon)" stroke-width="3" filter="url(#scGlow)" />
</svg>